name: Build tvOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    # The app needs Xcode 27; this label is GitHub's Xcode 27 image (Apple Silicon)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project _Project/Browser.xcodeproj \
            -scheme Browser \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/*.app Payload/
          zip -qry tvOSBrowser.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: tvOSBrowser-ipa
          path: tvOSBrowser.ipa
